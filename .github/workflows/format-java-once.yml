name: One-time Java formatting repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-java-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Apply the repository-pinned Java formatter
        run: |
          python scripts/format_java.py
          python scripts/format_java.py --check
      - name: Commit only the formatter output and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/src/main/java/com/pilipala/marcomovie/SourceController.java
          git rm .github/workflows/format-java-once.yml
          git commit -m "style(android): apply pinned Java formatter"
          git push origin main
